<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Order Slip</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">

    <!-- PAGE 1 -->
    <div id="page1">
        <h2>Start Order</h2>

        <label>Chart</label>
        <select id="chartSelect"></select>

        <label>Shop Name</label>
        <input type="text" id="shopName">

        <label>Order By</label>
        <input type="text" id="orderBy">

        <label>Default Qty</label>
        <input type="number" id="defaultQty" value="1">

        <label>Items / Row</label>
        <input type="number" id="itemsPerRow" value="4">

        <button id="startBtn">Start Order</button>
    </div>

    <!-- PAGE 2 -->
    <div id="page2" style="display:none;">

        <div class="nav">
            <button id="prevBtn">⬅</button>
            <select id="itemSelect"></select>
            <button id="nextBtn">➡</button>
        </div>

        <div class="progress">
            <span id="progressText"></span>
            <span id="selectedCount"></span>
        </div>

        <canvas id="itemCanvas"></canvas>

        <button id="yesBtn">YES</button>
        <button id="noBtn">NO</button>
        <button id="backBtn">Back</button>
    </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
