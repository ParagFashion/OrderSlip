<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Order Slip</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ================= START PAGE ================= -->
<div class="page active" id="pageStart">

  <div class="edit-section">
    <h3>Start Order</h3>

    Chart:
    <select id="chartSelect"></select><br>

    Shop:
    <input id="shopCode"><br>

    Order By:
    <input id="orderBy"><br>

    Default Qty:
    <input id="defaultQty" type="number" value="30"><br>

    Items / Row:
    <input id="cols" type="number" value="5"><br>

    <button id="startBtn">Start Ordering</button>
    <button id="resumeBtn" style="display:none;">Resume Order</button>
  </div>

</div>


<!-- ================= ORDER PAGE ================= -->
<div class="page" id="pageOrder">

  <div class="order-box">

    <div class="preview-wrap">

      <div class="crop-container">
        <img id="chartImg">
      </div>

      <div class="full-container" style="display:none;">
        <div class="full-image-wrapper">
          <img id="chartFullImg">
          <div class="highlight-box"></div>
        </div>
      </div>

      <div class="color-label" id="colorLabel"></div>

    </div>

    <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;">
      
      <button class="nav-btn" id="prevBtn">◀</button>
      
      <select id="liveNumber" style="font-size:22px;padding:6px 12px;border-radius:10px;"></select>
      
      <button class="nav-btn" id="nextBtn">▶</button>
      
    </div>

    Qty:
    <input id="liveQty" type="number"><br>

    <button class="yes" id="yesBtn">YES</button>
    <button class="no" id="noBtn">NO</button>

    <div style="margin-top:10px;">
      Items: <span id="countItems">0</span> |
      Qty: <span id="countQty">0</span>
    </div>

    <button class="nav-btn" id="seeListBtn">See List</button>
    <button class="resume" id="backStartBtn">⬅ Back</button>

  </div>

</div>


<!-- ================= PRINT PAGE ================= -->
<div class="page" id="pagePrint">

  <div class="header">
    <div>Shop: <span id="pShop"></span></div>
    <div>Date: <span id="pDate"></span></div>
  </div>

  <div class="party" id="pChartName"></div>

  <div class="line-sep"></div>

  <div class="order-grid"></div>

  <div class="line-sep"></div>

  <div class="footer">
    <div>
      Order By: <span id="pOrderBy"></span><br>
      Remarks: <span id="pRemarks"></span>
    </div>
    <div>
      Items: <span id="pTotalItems"></span><br>
      Qty: <span id="pTotalQty"></span>
    </div>
  </div>

  <button id="printBtn">Print</button>
  <button id="backOrderBtn">Back</button>

</div>

<!-- ================= POPUP ================= -->
<div class="popup">
  <div class="popup-box">
    Code:<br>
    <input id="popCode" readonly><br>

    Qty:<br>
    <input id="popQty" type="number"><br>

    Extra:<br>
    <input id="popExtra"><br>

    <input id="popColor" hidden><br>

    <button id="popUpdate">Update</button>
    <button id="popDelete">Delete</button>
    <button id="popClose">Close</button>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
